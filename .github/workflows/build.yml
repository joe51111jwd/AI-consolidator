# Builds the Linux (AppImage, deb) and Windows (NSIS) installers and runs the whole test suite on
# Linux. Run it from the Actions tab (Run workflow) or by pushing a v* tag. Installers are uploaded
# as workflow artifacts only: nothing is published as a GitHub Release.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      - name: Install xvfb and Electron's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libnotify4 libsecret-1-0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: node --test "tests/*.test.cjs"
      - name: Relay tests
        working-directory: relay
        run: npm ci && npm test
      - name: Whole suite, end to end (real Electron app under xvfb)
        env:
          SB_SHOTS: ${{ runner.temp }}/e2e-shots
          SB_APP_LOG: ${{ runner.temp }}/e2e-shots/app.log
        run: |
          mkdir -p "$SB_SHOTS"
          xvfb-run -a npm test
      - name: Keep the screenshots and app log of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: ${{ runner.temp }}/e2e-shots
          retention-days: 7

  installer:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            targets: --linux AppImage deb
            artifact: switchboard-linux
            files: |
              release/*.AppImage
              release/*.deb
          - name: Windows
            os: windows-latest
            targets: --win nsis
            artifact: switchboard-windows
            files: |
              release/*Setup*.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install xvfb and Electron's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libnotify4 libsecret-1-0
      - run: npm ci
      - run: npm run build
      - name: Build the installer
        run: npx electron-builder ${{ matrix.targets }} --publish never
      # tests/smoke.cjs: the window loads with the version tag in the corner, the top bar doesn't
      # overlap at any width, and a saved key reads back after a restart.
      - name: Open the AppImage
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls release/*.AppImage | head -1)
          chmod +x "$appimage"
          SB_SMOKE_SHOT="$RUNNER_TEMP/linux-window.png" xvfb-run -a -s "-screen 0 1920x1080x24" node tests/smoke.cjs "$appimage"
      - name: Open the AppImage on a desktop whose keyring is missing
        if: runner.os == 'Linux'
        run: SB_SMOKE_DESKTOP=GNOME xvfb-run -a -s "-screen 0 1920x1080x24" node tests/smoke.cjs "$(ls release/*.AppImage | head -1)"
      - name: Install the deb and open the installed app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "./$(ls release/*.deb | head -1)"
          xvfb-run -a -s "-screen 0 1920x1080x24" node tests/smoke.cjs /opt/Switchboard/switchboard
      - name: Install with the installer and open the installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\*Setup*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Switchboard.exe | Select-Object -First 1
          if (-not $exe) { throw "Switchboard.exe was not installed under $env:LOCALAPPDATA\Programs" }
          Write-Host "Installed at $($exe.FullName)"
          $env:SB_SMOKE_SHOT = "$env:RUNNER_TEMP\windows-window.png"
          node tests/smoke.cjs $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
      - name: Keep the window screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-screenshot
          path: ${{ runner.temp }}/*-window.png
          if-no-files-found: ignore
          retention-days: 7
